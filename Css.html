<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three Types of CSS</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        h1 {
            color: darkblue;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .internal-box {
            background-color: lightgray;
            padding: 15px;
            border: 1px solid #333;

            
h2 {
    color: purple;
    text-decoration: underline;
}
        }
    </style>
</head>
<body>

    <h1>Comparing the 3 Types of CSS</h1>

    <div class="internal-box">
        <p>This box and the main heading above are styled using <strong>Internal CSS</strong>.</p>
    </div>

    <h2>This Heading uses External CSS</h2>

    <p style="color: red; font-weight: bold; font-size: 18px;">
        This specific paragraph is styled using Inline CSS.
    </p>

  


</body>
</html>
